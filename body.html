<!DOCTYPE html>
<html>

<head>
    <title>Home Body</title>
</head>

<body style="
    margin: 0;
    font-family: Arial;
    background-color: #fff7f0;
">

    <!-- Hero -->

    <section style="
        text-align: center;
        padding: 80px 20px;
    ">

        <h1 style="

        </h1>

        <p style="
            font-size: 18px;

        <button style="
            padding: 12px 25px;
            margin: 15px;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 5px;
        ">
            Browse Books
        </button>

        <button style="
            padding: 12px 25px;
            background-color: white;
            color: #e67e22;
            border: 1px solid #e67e22;
            border-radius: 5px;

        </button>

    </section>


    <!-- Categories -->

    <section style="
        text-align: center;
        padding: 40px;

    ">

        <div style="
            display: flex;

            gap: 20px;
            margin-top: 30px;
        ">

            <div style="
                padding: 25px;
                width: 180px;
                background-color: #fff7f0;
                border-radius: 8px;
            ">
                📚
                <h3>Engineering</h3>
            </div>

            <div style="
                padding: 25px;
                width: 180px;
                background-color: #fff7f0;
                border-radius: 8px;
            ">
                📖
                <h3>Novels</h3>
            </div>

            <div style="
                padding: 25px;
                width: 180px;
                background-color: #fff7f0;
                border-radius: 8px;
            ">
                📘
                <h3>Competitive Exams</h3>
            </div>

        </div>

    </section>


    <!-- How It Works -->

    <section style="
        text-align: center;
        padding: 50px;
    ">

        <h2>How It Works</h2>

        <p>1. Find a book</p>
        <p>2. Contact the seller</p>
        <p>3. Buy the book</p>

    </section>

</body>

</html>
