<!DOCTYPE html>
<html>
<head>
    <title>BookMart Login</title>

    <style>
        body {
            font-family: Arial;
            background: #fff7f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 30px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px 30px;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 5px;
        }

        a {
            color: #e67e22;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Releaf Login</h2>

        <input type="email" placeholder="Email">

        <input type="password" placeholder="Password">

        <button>Login</button>

        <p>Don't have an account?
            <a href="#">Register</a>
        </p>

    </div>

</body>
</html>
